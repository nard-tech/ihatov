name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4', '4.0']
    env:
      IHATOV_RUBY_VERSION: ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@v6
      - name: Use the runner's file owner
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Validate the Compose configuration
        run: docker compose config --quiet
      - name: Build the development image
        run: docker compose build dev
      - name: Verify the development dependencies
        run: docker compose run --rm dev bundle check
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4', '4.0']
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Test the core library without bundled data
        run: bundle exec rspec spec/ihatov_spec.rb spec/repository_spec.rb
      - name: Build and load the installed gem outside the checkout
        run: |
          gem build ihatov.gemspec --output /tmp/ihatov.gem
          gem install /tmp/ihatov.gem --no-document --install-dir /tmp/ihatov-installed
          cd /tmp
          GEM_HOME=/tmp/ihatov-installed GEM_PATH=/tmp/ihatov-installed ruby -rihatov -e 'abort unless Ihatov::VERSION'
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rubocop
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec yard doc --fail-on-warning
