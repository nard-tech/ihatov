name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4', '4.0']
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec
      - name: Build and test the installed gem outside the checkout
        run: |
          gem build ihatov.gemspec --output /tmp/ihatov.gem
          gem install /tmp/ihatov.gem --no-document --install-dir /tmp/ihatov-installed
          cd /tmp
          GEM_HOME=/tmp/ihatov-installed GEM_PATH=/tmp/ihatov-installed ruby -rihatov -e 'abort unless Ihatov.quote.frozen?'
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rubocop
      - run: bundle exec yard doc --fail-on-warning
