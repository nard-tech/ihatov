works:
  - id: tono-monogatari
    title: 遠野物語
    published_year: 1910
    edition:
      aozora_id: 52504
      url: https://www.aozora.gr.jp/cards/001566/card52504.html
      bibliography: |-
        「遠野物語・山の人生」岩波文庫、岩波書店
        1976年4月16日第1刷発行
        2007年10月4日第47刷改版発行、2010年3月5日第50刷発行
        初出：「遠野物語」柳田國男、1910年6月14日発行
    quotes:
      - id: tono-monogatari-episode-50
        kind: passage
        location: 第50話
        source_url: https://www.aozora.gr.jp/cards/001566/files/52504_49667.html
        text: 死助（しすけ）の山にカッコ花あり。遠野郷にても珍しという花なり。五月閑古鳥（かんこどり）の啼（な）くころ、女や子どもこれを採（と）りに山へ行く。酢（す）の中に漬（つ）けて置けば紫色（むらさきいろ）になる。酸漿（ほおずき）の実（み）のように吹きて遊ぶなり。この花を採ることは若き者の最も大なる遊楽なり。
      - id: tono-monogatari-episode-51
        kind: passage
        location: 第51話
        source_url: https://www.aozora.gr.jp/cards/001566/files/52504_49667.html
        text: 山にはさまざまの鳥住（す）めど、最も寂（さび）しき声の鳥はオット鳥なり。夏の夜中（よなか）に啼（な）く。浜の大槌（おおづち）より駄賃附（だちんづけ）の者など峠を越え来たれば、遥（はるか）に谷底にてその声を聞くといえり。昔ある長者の娘あり。またある長者の男の子と親（した）しみ、山に行きて遊びしに、男見えずなりたり。夕暮になり夜になるまで探（さが）しあるきしが、これを見つくることをえずして、ついにこの鳥になりたりという。オットーン、オットーンというは夫（おっと）のことなり。末の方かすれてあわれなる鳴声（なきごえ）なり。
      - id: tono-monogatari-episode-57
        kind: passage
        location: 第57話
        source_url: https://www.aozora.gr.jp/cards/001566/files/52504_49667.html
        # 原文が一段落なので、行数を増やすための改行は加えない。
        text: 川の岸の砂（すな）の上には川童の足跡（あしあと）というものを見ること決して珍しからず。雨の日の翌日などはことにこの事あり。猿の足と同じく親指（おやゆび）は離れて人間の手の跡（あと）に似たり。長さは三寸に足らず。指先のあとは人ののように明らかには見えずという。
      - id: tono-three-goddesses
        kind: passage
        location: 第2話・本文（巻末注を除く）
        source_url: https://www.aozora.gr.jp/cards/001566/files/52504_49667.html
        text: 遠野の町は南北の川の落合（おちあい）にあり。以前は七七十里（しちしちじゅうり）とて、七つの渓谷おのおの七十里の奥より売買（ばいばい）の貨物を聚（あつ）め、その市（いち）の日は馬千匹、人千人の賑（にぎ）わしさなりき。四方の山々の中に最も秀（ひい）でたるを早池峯（はやちね）という、北の方附馬牛（つくもうし）の奥にあり。東の方には六角牛（ろっこうし）山立てり。石神（いしがみ）という山は附馬牛と達曾部（たっそべ）との間にありて、その高さ前の二つよりも劣（おと）れり。大昔に女神あり、三人の娘を伴（とも）ないてこの高原に来たり、今の来内（らいない）村の伊豆権現（いずごんげん）の社あるところに宿（やど）りし夜、今夜よき夢を見たらん娘によき山を与うべしと母の神の語りて寝たりしに、夜深く天より霊華（れいか）降（ふ）りて姉の姫（ひめ）の胸の上に止りしを、末の姫眼覚（めさ）めて窃（ひそか）にこれを取り、わが胸の上に載せたりしかば、ついに最も美しき早池峯の山を得、姉たちは六角牛と石神とを得たり。若き三人の女神おのおの三の山に住し今もこれを領したもう故（ゆえ）に、遠野の女どもはその妬（ねたみ）を畏（おそ）れて今もこの山には遊ばずといえり。
      - id: tono-zashiki-warashi
        kind: passage
        location: 第17話・本文（巻末注を除く）
        source_url: https://www.aozora.gr.jp/cards/001566/files/52504_49667.html
        text: 旧家（きゅうか）にはザシキワラシという神の住みたもう家少なからず。この神は多くは十二三ばかりの童児なり。おりおり人に姿を見することあり。土淵村大字飯豊（いいで）の今淵（いまぶち）勘十郎という人の家にては、近きころ高等女学校にいる娘の休暇にて帰りてありしが、或る日廊下（ろうか）にてはたとザシキワラシに行き逢（あ）い大いに驚きしことあり。これは正（まさ）しく男の児（こ）なりき。同じ村山口なる佐々木氏にては、母人ひとり縫物（ぬいもの）しておりしに、次の間にて紙のがさがさという音あり。この室は家の主人の部屋（へや）にて、その時は東京に行き不在の折なれば、怪しと思いて板戸を開き見るに何の影もなし。しばらくの間（あいだ）坐（すわ）りて居ればやがてまた頻（しきり）に鼻を鳴（な）らす音あり。さては座敷（ざしき）ワラシなりけりと思えり。この家にも座敷ワラシ住めりということ、久しき以前よりの沙汰（さた）なりき。この神の宿（やど）りたもう家は富貴自在なりということなり。
      - id: tono-saru-no-futtachi
        kind: passage
        location: 第46話・本文（巻末注を除く）
        source_url: https://www.aozora.gr.jp/cards/001566/files/52504_49667.html
        text: 栃内村の林崎（はやしざき）に住む何某という男、今は五十に近し。十年あまり前のことなり。六角牛山に鹿を撃ちに行き、オキを吹きたりしに、猿の経立あり、これを真（まこと）の鹿なりと思いしか、地竹（じだけ）を手にて分（わ）けながら、大なる口をあけ嶺の方より下（くだ）り来たれり。胆（きも）潰（つぶ）れて笛を吹きやめたれば、やがて反（そ）れて谷の方へ走り行きたり。
      - id: tono-underwater-loom
        kind: passage
        location: 第54話・本文（巻末注を除く）
        source_url: https://www.aozora.gr.jp/cards/001566/files/52504_49667.html
        text: 閉伊川（へいがわ）の流（なが）れには淵（ふち）多く恐ろしき伝説少なからず。小国川との落合に近きところに、川井（かわい）という村あり。その村の長者の奉公人、ある淵の上なる山にて樹を伐るとて、斧（おの）を水中に取（と）り落（おと）したり。主人の物なれば淵に入りてこれを探（さぐ）りしに、水の底に入るままに物音聞ゆ。これを求めて行くに岩の陰に家あり。奥の方に美しき娘機（はた）を織りていたり。そのハタシに彼の斧は立てかけてありたり。これを返したまわらんという時、振り返りたる女の顔を見れば、二三年前に身まかりたる我が主人の娘なり。斧は返すべければ我がこの所（ところ）にあることを人にいうな。その礼としてはその方身上（しんしょう）良（よ）くなり、奉公をせずともすむようにして遣（や）らんといいたり。そのためなるか否かは知らず、その後胴引（どうびき）などいう博奕（ばくち）に不思議に勝ち続（つづ）けて金（かね）溜（たま）り、ほどなく奉公をやめ家に引き込みて中（ちゅう）ぐらいの農民になりたれど、この男は疾（と）くに物忘れして、この娘のいいしことも心づかずしてありしに、或る日同じ淵の辺（ほとり）を過（す）ぎて町へ行くとて、ふと前の事を思い出し、伴（とも）なえる者に以前かかることありきと語りしかば、やがてその噂（うわさ）は近郷に伝わりぬ。その頃より男は家産再び傾（かたむ）き、また昔の主人に奉公して年を経たり。家の主人は何と思いしにや、その淵に何荷（なんが）ともなく熱湯を注（そそ）ぎ入れなどしたりしが、何の効もなかりしとのことなり。
      - id: tono-red-kappa
        kind: passage
        location: 第59話・本文（巻末注を除く）
        source_url: https://www.aozora.gr.jp/cards/001566/files/52504_49667.html
        text: 外（ほか）の地にては川童の顔は青しというようなれど、遠野の川童は面（つら）の色（いろ）赭（あか）きなり。佐々木氏の曾祖母（そうそぼ）、穉（おさな）かりしころ友だちと庭にて遊びてありしに、三本ばかりある胡桃（くるみ）の木の間より、真赤（まっか）なる顔したる男の子の顔見えたり。これは川童なりしとなり。今もその胡桃大木にてあり。この家の屋敷のめぐりはすべて胡桃の樹なり。
      - id: tono-mayoiga-bowl
        kind: passage
        location: 第63話・本文（巻末注を除く）
        source_url: https://www.aozora.gr.jp/cards/001566/files/52504_49667.html
        text: 小国（おぐに）の三浦某というは村一の金持（かねもち）なり。今より二三代前の主人、まだ家は貧しくして、妻は少しく魯鈍（ろどん）なりき。この妻ある日門（かど）の前（まえ）を流るる小さき川に沿いて蕗（ふき）を採（と）りに入りしに、よき物少なければ次第に谷奥深く登りたり。さてふと見れば立派なる黒き門（もん）の家あり。訝（いぶか）しけれど門の中に入りて見るに、大なる庭にて紅白の花一面に咲き鶏（にわとり）多く遊べり。その庭を裏（うら）の方へ廻（まわ）れば、牛小屋ありて牛多くおり、馬舎（うまや）ありて馬多くおれども、一向に人はおらず。ついに玄関より上（あが）りたるに、その次の間には朱と黒との膳椀（ぜんわん）をあまた取り出したり。奥の座敷には火鉢（ひばち）ありて鉄瓶（てつびん）の湯のたぎれるを見たり。されどもついに人影はなければ、もしや山男の家ではないかと急に恐ろしくなり、駆（か）け出（だ）して家に帰りたり。この事を人に語れども実（まこと）と思う者もなかりしが、また或る日わが家のカドに出でて物を洗いてありしに、川上より赤き椀一つ流れてきたり。あまり美しければ拾い上げたれど、これを食器に用いたらば汚（きたな）しと人に叱（しか）られんかと思い、ケセネギツの中に置きてケセネを量（はか）る器（うつわ）となしたり。しかるにこの器にて量り始めてより、いつまで経（た）ちてもケセネ尽きず。家の者もこれを怪しみて女に問いたるとき、始めて川より拾い上げし由（よし）をば語りぬ。この家はこれより幸運に向い、ついに今の三浦家となれり。遠野にては山中の不思議（ふしぎ）なる家をマヨイガという。マヨイガに行き当りたる者は、必ずその家の内の什器（じゅうき）家畜何にてもあれ持ち出でて来べきものなり。その人に授（さず）けんがためにかかる家をば見するなり。女が無慾にて何ものをも盗み来ざりしが故に、この椀自ら流れて来たりしなるべしといえり。
        content_warnings:
          - 知的能力への侮蔑的な表現を含む。
      - id: tono-oshirasama
        kind: passage
        location: 第69話・本文（巻末注を除く）
        source_url: https://www.aozora.gr.jp/cards/001566/files/52504_49667.html
        text: 今の土淵村には大同（だいどう）という家二軒あり。山口の大同は当主を大洞万之丞（おおほらまんのじょう）という。この人の養母名はおひで、八十を超（こ）えて今も達者なり。佐々木氏の祖母の姉なり。魔法に長じたり。まじないにて蛇を殺し、木に止（とま）れる鳥を落しなどするを佐々木君はよく見せてもらいたり。昨年の旧暦正月十五日に、この老女の語りしには、昔あるところに貧しき百姓あり。妻はなくて美しき娘あり。また一匹の馬を養う。娘この馬を愛して夜（よる）になれば厩舎（うまや）に行きて寝（い）ね、ついに馬と夫婦になれり。或る夜父はこの事を知りて、その次の日に娘には知らせず、馬を連（つ）れ出して桑の木につり下げて殺したり。その夜娘は馬のおらぬより父に尋ねてこの事を知り、驚き悲しみて桑の木の下に行き、死したる馬の首に縋（すが）りて泣きいたりしを、父はこれを悪（にく）みて斧をもって後（うしろ）より馬の首を切り落せしに、たちまち娘はその首に乗りたるまま天に昇（のぼ）り去れり。オシラサマというはこの時より成りたる神なり。馬をつり下げたる桑の枝にてその神の像を作る。その像三つありき。本（もと）にて作りしは山口の大同にあり。これを姉神とす。中にて作りしは山崎の在家権十郎（ざいけごんじゅうろう）という人の家にあり。佐々木氏の伯母が縁づきたる家なるが、今は家絶えて神の行方（ゆくえ）を知らず。末（すえ）にて作りし妹神の像は今（いま）附馬牛村にありといえり。
        content_warnings:
          - 動物の殺害・切断と、人と馬の婚姻への言及を含む。
      - id: tono-yuki-onna
        kind: passage
        location: 第103話・本文（巻末注を除く）
        source_url: https://www.aozora.gr.jp/cards/001566/files/52504_49667.html
        text: 小正月の夜、または小正月ならずとも冬の満月の夜は、雪女が出でて遊ぶともいう。童子をあまた引き連れてくるといえり。里の子ども冬は近辺の丘に行き、橇遊（そりっこあそ）びをして面白さのあまり夜になることあり。十五日の夜に限り、雪女が出るから早く帰れと戒めらるるは常のことなり。されど雪女を見たりという者は少なし。
      - id: tono-mirage
        kind: passage
        location: 第106話・本文（巻末注を除く）
        source_url: https://www.aozora.gr.jp/cards/001566/files/52504_49667.html
        text: 海岸の山田にては蜃気楼（しんきろう）年々見ゆ。常に外国の景色なりという。見馴（みな）れぬ都のさまにして、路上の車馬しげく人の往来眼ざましきばかりなり。年ごとに家の形などいささかも違うことなしといえり。
