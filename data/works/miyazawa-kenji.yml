  - id: yodaka-no-hoshi
    title: よだかの星
    edition:
      aozora_id: 473
      url: https://www.aozora.gr.jp/cards/000081/card473.html
      bibliography: |-
        「新編　銀河鉄道の夜」新潮文庫、新潮社
        1989年6月15日初版発行
        入力：1991年3月10日第4刷、校正：1994年6月5日第13刷
        底本の親本：「新修宮沢賢治全集　第八巻」筑摩書房、1979年5月
    quotes:
      - id: yodaka-no-hoshi-opening
        kind: passage
        location: 冒頭5段落
        source_url: https://www.aozora.gr.jp/cards/000081/files/473_42318.html
        content_warnings:
          - 容姿を理由にした侮蔑や排斥、いじめの描写があります。
        text: |-
          よだかは、実にみにくい鳥です。
          顔は、ところどころ、味噌をつけたようにまだらで、くちばしは、ひらたくて、耳までさけています。
          足は、まるでよぼよぼで、一間（いっけん）とも歩けません。
          ほかの鳥は、もう、よだかの顔を見ただけでも、いやになってしまうという工合（ぐあい）でした。
          たとえば、ひばりも、あまり美しい鳥ではありませんが、よだかよりは、ずっと上だと思っていましたので、夕方など、よだかにあうと、さもさもいやそうに、しんねりと目をつぶりながら、首をそっ方（ぽ）へ向けるのでした。もっとちいさなおしゃべりの鳥などは、いつでもよだかのまっこうから悪口をしました。

