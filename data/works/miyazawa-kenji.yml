  - id: kaze-no-matasaburo
    title: 風の又三郎
    edition:
      aozora_id: 462
      url: https://www.aozora.gr.jp/cards/000081/card462.html
      bibliography: |-
        「童話集　風の又三郎」岩波文庫、岩波書店
        1951年4月25日第1刷発行
        1967年7月16日第24刷改版発行
    quotes:
      - id: kaze-no-matasaburo-opening
        kind: passage
        location: 冒頭
        source_url: https://www.aozora.gr.jp/cards/000081/files/462_15405.html
        text: |-
          どっどど どどうど どどうど どどう
          青いくるみも吹きとばせ
          すっぱいかりんも吹きとばせ
          どっどど どどうど どどうど どどう
          　谷川の岸に小さな学校がありました。
          　教室はたった一つでしたが生徒は三年生がないだけで、あとは一年から六年までみんなありました。運動場もテニスコートのくらいでしたが、すぐうしろは栗（くり）の木のあるきれいな草の山でしたし、運動場のすみにはごぼごぼつめたい水を噴（ふ）く岩穴もあったのです。
    beings:
