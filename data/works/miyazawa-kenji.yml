  - id: yamanashi
    title: やまなし
    announced_year: 1923
    edition:
      aozora_id: 46605
      url: https://www.aozora.gr.jp/cards/000081/card46605.html
      bibliography: |-
        「新編風の又三郎」新潮文庫、新潮社
        1989年2月25日発行、1989年6月10日2刷
        初出：「岩手毎日新聞」岩手毎日新聞社、1923年4月8日
    quotes:
      - id: yamanashi-may
        kind: passage
        location: 一、五月・冒頭
        source_url: https://www.aozora.gr.jp/cards/000081/files/46605_31178.html
        text: |-
          二疋（ひき）の蟹の子供らが青じろい水の底で話していました。
          『クラムボンはわらったよ。』
          『クラムボンはかぷかぷわらったよ。』
          『クラムボンは跳ねてわらったよ。』
          『クラムボンはかぷかぷわらったよ。』
          上の方や横の方は、青くくらく鋼（はがね）のように見えます。そのなめらかな天井を、つぶつぶ暗い泡が流れて行きます。
      - id: yamanashi-december
        kind: passage
        location: 二、十二月・冒頭
        source_url: https://www.aozora.gr.jp/cards/000081/files/46605_31178.html
        text: |-
          蟹の子供らはもうよほど大きくなり、底の景色も夏から秋の間にすっかり変りました。
          白い柔かな円石（まるいし）もころがって来、小さな錐（きり）の形の水晶の粒や、金雲母（きんうんも）のかけらもながれて来てとまりました。
          そのつめたい水の底まで、ラムネの瓶（びん）の月光がいっぱいに透（すき）とおり天井では波が青じろい火を、燃したり消したりしているよう、あたりはしんとして、ただいかにも遠くからというように、その波の音がひびいて来るだけです。
    beings:
      - id: clammbon
        kind: creature
        name: クラムボン
        location: 一、五月
        source_url: https://www.aozora.gr.jp/cards/000081/files/46605_31178.html
    onomatopoeias:
      - id: kapu-kapu
        text: かぷかぷ
        location: 一、五月
        source_url: https://www.aozora.gr.jp/cards/000081/files/46605_31178.html
      - id: tobun
        text: トブン
        location: 二、十二月
        source_url: https://www.aozora.gr.jp/cards/000081/files/46605_31178.html

  - id: haru-to-shura
    title: 春と修羅
    published_year: 1924
    edition:
      aozora_id: 1058
      url: https://www.aozora.gr.jp/cards/000081/card1058.html
      bibliography: |-
        「宮沢賢治全集1」ちくま文庫、筑摩書房
        1986年2月26日第1刷発行
        1998年5月12日第17刷発行
    quotes:
      - id: haru-to-shura-preface
        kind: poem
        location: 序・冒頭
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          わたくしといふ現象は
          仮定された有機交流電燈の
          ひとつの青い照明です
          （あらゆる透明な幽霊の複合体）
          風景やみんなといつしよに
          せはしくせはしく明滅しながら
          いかにもたしかにともりつづける
          因果交流電燈の
          ひとつの青い照明です
      - id: haru-to-shura-sky
        kind: poem
        location: 春と修羅・「砕ける雲の眼路をかぎり」から
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          砕ける雲の眼路（めぢ）をかぎり
            れいろうの天の海には
              聖玻璃（せいはり）の風が行き交ひ
                ZYPRESSEN 春のいちれつ
                  くろぐろと光素（エーテル）を吸ひ
                    その暗い脚並からは
                      天山の雪の稜さへひかるのに
                      （かげろふの波と白い偏光）
                      まことのことばはうしなはれ
                    雲はちぎれてそらをとぶ
                  ああかがやきの四月の底を
                はぎしり燃えてゆききする
              おれはひとりの修羅なのだ
      - id: kussetsuritsu
        kind: poem
        location: 屈折率
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          七つ森のこつちのひとつが
          水の中よりもつと明るく
          そしてたいへん巨きいのに
          わたくしはでこぼこ凍つたみちをふみ
          このでこぼこの雪をふみ
          向ふの縮れた亜鉛（あえん）の雲へ
          陰気な郵便脚夫（きやくふ）のやうに
              （またアラツデイン　洋燈（ラムプ）とり）
          急がなければならないのか
      - id: nichirin-to-taichi
        kind: poem
        location: 日輪と太市
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          日は今日は小さな天の銀盤で
          雲がその面（めん）を
          どんどん侵してかけてゐる
          吹雪（フキ）も光りだしたので
          太市は毛布（けつと）の赤いズボンをはいた
      - id: carbide-soko
        kind: poem
        location: カーバイト倉庫・冒頭
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          まちなみのなつかしい灯とおもつて
          いそいでわたくしは雪と蛇紋岩（サーベンタイン）との
          山峡（さんけふ）をでてきましたのに
          これはカーバイト倉庫の軒
          すきとほつてつめたい電燈です
      - id: cobalt-sanchi
        kind: poem
        location: コバルト山地
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          コバルト山地の氷霧（ひようむ）のなかで
          あやしい朝の火が燃えてゐます
          毛無森（けなしのもり）のきり跡あたりの見当（けんたう）です
          たしかにせいしんてきの白い火が
          水より強くどしどしどしどし燃えてゐます
      - id: tani
        kind: poem
        location: 谷
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          ひかりの澱
          三角ばたけのうしろ
          かれ草層の上で
          わたくしの見ましたのは
          顔いつぱいに赤い点うち
          硝子様（やう）鋼青のことばをつかつて
          しきりに歪み合ひながら
          何か相談をやつてゐた
          三人の妖女たちです
      - id: fukei
        kind: poem
        location: 風景
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          雲はたよりないカルボン酸
          さくらは咲いて日にひかり
          また風が来てくさを吹けば
          截られたたらの木もふるふ
            さつきはすなつちに廐肥（きうひ）をまぶし
                （いま青ガラスの模型の底になつてゐる）
          ひばりのダムダム弾（だん）がいきなりそらに飛びだせば
              風は青い喪神をふき
              黄金の草　ゆするゆする
                  雲はたよりないカルボン酸
                  さくらが日に光るのはゐなか風（ふう）だ
      - id: okinagusa-poem
        kind: poem
        location: おきなぐさ
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          風はそらを吹き
          そのなごりは草をふく
          おきなぐさ冠毛（くわんもう）の質直（しつぢき）
          松とくるみは宙に立ち
              （どこのくるみの木にも
                いまみな金のあかごがぶらさがる）
          ああ黒のしやつぽのかなしさ
          おきなぐさのはなをのせれば
          幾きれうかぶ光酸（くわうさん）の雲
      - id: kawabata
        kind: poem
        location: かはばた
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          かはばたで鳥もゐないし
          （われわれのしよふ燕麦（オート）の種子（たね）は）
          風の中からせきばらひ
          おきなぐさは伴奏をつゞけ
          光のなかの二人の子
      - id: iwatesan-poem
        kind: poem
        location: 岩手山・全文
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          そらの散乱反射（さんらんはんしや）のなかに
          古ぼけて黒くゑぐるもの
          ひかりの微塵系列（みぢんけいれつ）の底に
          きたなくしろく澱（よど）むもの
      - id: eiketsu-no-asa
        kind: poem
        location: 永訣の朝・冒頭7行
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html#midashi1178
        text: |2-
          けふのうちに
          とほくへいつてしまふわたくしのいもうとよ
          みぞれがふつておもてはへんにあかるいのだ
                （あめゆじゆとてちてけんじや）
          うすあかくいつそう陰惨（いんざん）な雲から
          みぞれはびちよびちよふつてくる
                （あめゆじゆとてちてけんじや）
      - id: kurakake-no-yuki
        kind: poem
        location: くらかけの雪・冒頭10行
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html#midashi220
        text: |2-
          たよりになるのは
          くらかけつづきの雪ばかり
          野はらもはやしも
          ぽしやぽしやしたり黝（くす）んだりして
          すこしもあてにならないので
          ほんたうにそんな酵母（かうぼ）のふうの
          朧（おぼ）ろなふぶきですけれども
          ほのかなのぞみを送るのは
          くらかけ山の雪ばかり
              （ひとつの古風（こふう）な信仰です）
      - id: koi-to-byonetsu
        kind: poem
        location: 恋と病熱・冒頭8行
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html#midashi280
        text: |2-
          けふはぼくのたましひは疾み
          烏（からす）さへ正視ができない
            あいつはちやうどいまごろから
            つめたい青銅（ブロンヅ）の病室で
            透明薔薇（ばら）の火に燃される
          ほんたうに　けれども妹よ
          けふはぼくもあんまりひどいから
          やなぎの花もとらない
      - id: koiwai-nojo
        kind: poem
        location: 小岩井農場・冒頭8行（パート一の見出しを除く）
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html#midashi620
        text: |2-
          わたくしはずゐぶんすばやく汽車からおりた
          そのために雲がぎらつとひかつたくらゐだ
          けれどももつとはやいひとはある
          化学の並川さんによく肖（に）たひとだ
          あのオリーブのせびろなどは
          そつくりおとなしい農学士だ
          さつき盛岡のていしやばでも
          たしかにわたくしはさうおもつてゐた
      - id: matsu-no-hari
        kind: poem
        location: 松の針・冒頭9行
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html#midashi1188
        text: |2-
              さつきのみぞれをとつてきた
              あのきれいな松のえだだよ
          おお　おまへはまるでとびつくやうに
          そのみどりの葉にあつい頬をあてる
          そんな植物性の青い針のなかに
          はげしく頬を刺させることは
          むさぼるやうにさへすることは
          どんなにわたくしたちをおどろかすことか
          そんなにまでもおまへは林へ行きたかつたのだ
      - id: musei-dokoku
        kind: poem
        location: 無声慟哭・冒頭11行
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html#midashi1198
        text: |2-
          こんなにみんなにみまもられながら
          おまへはまだここでくるしまなければならないか
          ああ巨きな信のちからからことさらにはなれ
          また純粋やちひさな徳性のかずをうしなひ
          わたくしが青ぐらい修羅をあるいてゐるとき
          おまへはじぶんにさだめられたみちを
          ひとりさびしく往かうとするか
          信仰を一つにするたつたひとりのみちづれのわたくしが
          あかるくつめたい精進（しやうじん）のみちからかなしくつかれてゐて
          毒草や蛍光菌のくらい野原をただよふとき
          おまへはひとりどこへ行かうとするのだ
      - id: aomori-banka
        kind: poem
        location: 青森挽歌・冒頭7行
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html#midashi1328
        text: |2-
          こんなやみよののはらのなかをゆくときは
          客車のまどはみんな水族館の窓になる
                （乾いたでんしんばしらの列が
                  せはしく遷つてゐるらしい
                  きしやは銀河系の玲瓏（れいろう）レンズ
                  巨きな水素のりんごのなかをかけてゐる）
          りんごのなかをはしつてゐる
      - id: okhotsk-banka
        kind: poem
        location: オホーツク挽歌・冒頭10行
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html#midashi1338
        text: |2-
          海面は朝の炭酸のためにすつかり銹びた
          緑青（ろくしやう）のとこもあれば藍銅鉱（アズライト）のとこもある
          むかふの波のちゞれたあたりはずゐぶんひどい瑠璃液（るりえき）だ
          チモシイの穂がこんなにみじかくなつて
          かはるがはるかぜにふかれてゐる
              （それは青いいろのピアノの鍵で
                かはるがはる風に押されてゐる）
          あるいはみじかい変種だらう
          しづくのなかに朝顔が咲いてゐる
          モーニンググローリのそのグローリ
    places:
