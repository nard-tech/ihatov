  - id: yuki-watari
    title: 雪渡り
    announced_year: 1921
    edition:
      aozora_id: 45679
      url: https://www.aozora.gr.jp/cards/000081/card45679.html
      bibliography: |-
        「注文の多い料理店」新潮文庫、新潮社
        1990年5月25日発行、1997年5月10日17刷
        初出：「愛国婦人」1921年12月号、1922年1月号
    quotes:
      - id: yuki-watari-opening
        kind: passage
        location: その一・冒頭
        source_url: https://www.aozora.gr.jp/cards/000081/files/45679_22349.html
        text: |-
          雪がすっかり凍って大理石よりも堅くなり、空も冷たい滑らかな青い石の板で出来ているらしいのです。
          「堅雪（かたゆき）かんこ、しみ雪しんこ。」
          お日様がまっ白に燃えて百合の匂（におい）を撒（ま）きちらし又雪をぎらぎら照らしました。
          木なんかみんなザラメを掛けたように霜でぴかぴかしています。
    beings:
