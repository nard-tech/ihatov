        kind: passage
        location: 冒頭
        source_url: https://www.aozora.gr.jp/cards/000081/files/462_15405.html
        text: |-
          どっどど どどうど どどうど どどう
          青いくるみも吹きとばせ
          すっぱいかりんも吹きとばせ
          どっどど どどうど どどうど どどう
          　谷川の岸に小さな学校がありました。
          　教室はたった一つでしたが生徒は三年生がないだけで、あとは一年から六年までみんなありました。運動場もテニスコートのくらいでしたが、すぐうしろは栗（くり）の木のあるきれいな草の山でしたし、運動場のすみにはごぼごぼつめたい水を噴（ふ）く岩穴もあったのです。
