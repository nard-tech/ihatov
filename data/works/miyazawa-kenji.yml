  - id: ginga-tetsudo-no-yoru
    title: 銀河鉄道の夜
    edition:
      aozora_id: 43737
      url: https://www.aozora.gr.jp/cards/000081/card43737.html
      bibliography: |-
        「銀河鉄道の夜」角川文庫、角川書店
        1969年7月20日改版
        入力：1987年3月30日改版50版、校正：1991年6月10日改版65版
        底本の親本：「宮澤賢治全集第十卷」筑摩書房、1967年10月25日
    quotes:
      - id: ginga-tetsudo-no-yoru-opening
        kind: passage
        location: 一 午後の授業・冒頭2段落
        source_url: https://www.aozora.gr.jp/cards/000081/files/43737_19215.html
        text: |-
          「ではみなさんは、そういうふうに川だと言われたり、乳の流れたあとだと言われたりしていた、このぼんやりと白いものがほんとうは何かご承知ですか」先生は、黒板につるした大きな黒い星座の図の、上から下へ白くけぶった銀河帯のようなところを指しながら、みんなに問いをかけました。
          カムパネルラが手をあげました。それから四、五人手をあげました。ジョバンニも手をあげようとして、急いでそのままやめました。たしかにあれがみんな星だと、いつか雑誌で読んだのでしたが、このごろはジョバンニはまるで毎日教室でもねむく、本を読むひまも読む本もないので、なんだかどんなこともよくわからないという気持ちがするのでした。
      - id: ginga-hontou-no-saiwai
        kind: passage
        location: 九 ジョバンニの切符・ほんとうのさいわい
        source_url: https://www.aozora.gr.jp/cards/000081/files/43737_19215.html#midashi90
        content_warnings:
          - 他者の幸福のために自分の身体を焼いてもよいとする、自己犠牲への言及があります。
        text: |-
          「カムパネルラ、また僕たち二人きりになったねえ、どこまでもどこまでもいっしょに行こう。僕はもう、あのさそりのように、ほんとうにみんなの幸のためならば僕のからだなんか百ぺん灼いてもかまわない」
          「うん。僕だってそうだ」カムパネルラの眼にはきれいな涙がうかんでいました。
          「けれどもほんとうのさいわいはいったいなんだろう」
          ジョバンニが言いました。
          「僕わからない」カムパネルラがぼんやり言いました。
          「僕たちしっかりやろうねえ」ジョバンニが胸いっぱい新しい力が湧くように、ふうと息をしながら言いました。
    beings:
