        kind: passage
        location: ホモイが貝の火を受け取った翌朝
        source_url: https://www.aozora.gr.jp/cards/000081/files/1942_42611.html
        text: |-
          　風が吹（ふ）いて草（くさ）の露（つゆ）がバラバラとこぼれます。つりがねそうが朝の鐘（かね）を、
          　「カン、カン、カンカエコ、カンコカンコカン」と鳴らしています。
          　ホモイはぴょんぴょん跳（と）んで樺（かば）の木の下に行きました。
