  - id: yamanashi
    title: やまなし
    announced_year: 1923
    edition:
      aozora_id: 46605
      url: https://www.aozora.gr.jp/cards/000081/card46605.html
      bibliography: |-
        「新編風の又三郎」新潮文庫、新潮社
        1989年2月25日発行、1989年6月10日2刷
        初出：「岩手毎日新聞」岩手毎日新聞社、1923年4月8日
    quotes:
      - id: yamanashi-may
        kind: passage
        location: 一、五月・冒頭
        source_url: https://www.aozora.gr.jp/cards/000081/files/46605_31178.html
        text: |-
          　二疋（ひき）の蟹（かに）の子供らが青じろい水の底で話していました。
          『クラムボンはわらったよ。』
          『クラムボンはかぷかぷわらったよ。』
          『クラムボンは跳（は）ねてわらったよ。』
          『クラムボンはかぷかぷわらったよ。』
          　上の方や横の方は、青くくらく鋼（はがね）のように見えます。そのなめらかな天井（てんじょう）を、つぶつぶ暗い泡（あわ）が流れて行きます。
      - id: yamanashi-december
        kind: passage
        location: 二、十二月・冒頭
        source_url: https://www.aozora.gr.jp/cards/000081/files/46605_31178.html
        text: |-
          　蟹の子供らはもうよほど大きくなり、底の景色も夏から秋の間にすっかり変りました。
          　白い柔（やわら）かな円石（まるいし）もころがって来、小さな錐（きり）の形の水晶（すいしょう）の粒や、金雲母（きんうんも）のかけらもながれて来てとまりました。
          　そのつめたい水の底まで、ラムネの瓶（びん）の月光がいっぱいに透（すき）とおり天井では波が青じろい火を、燃したり消したりしているよう、あたりはしんとして、ただいかにも遠くからというように、その波の音がひびいて来るだけです。
    beings:
      - id: clammbon
        kind: creature
        name: クラムボン
        location: 一、五月
        source_url: https://www.aozora.gr.jp/cards/000081/files/46605_31178.html
    onomatopoeias:
      - id: kapu-kapu
        text: かぷかぷ
