  - id: haru-to-shura
    title: 春と修羅
    published_year: 1924
    edition:
      aozora_id: 1058
      url: https://www.aozora.gr.jp/cards/000081/card1058.html
      bibliography: |-
        「宮沢賢治全集1」ちくま文庫、筑摩書房
        1986年2月26日第1刷発行
        1998年5月12日第17刷発行
    quotes:
      - id: haru-to-shura-preface
        kind: poem
        location: 序・冒頭
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          わたくしといふ現象は
          仮定された有機交流電燈の
          ひとつの青い照明です
          （あらゆる透明な幽霊の複合体）
          風景やみんなといつしよに
          せはしくせはしく明滅しながら
          いかにもたしかにともりつづける
          因果交流電燈の
          ひとつの青い照明です
      - id: haru-to-shura-sky
        kind: poem
        location: 春と修羅・「砕ける雲の眼路をかぎり」から
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          砕ける雲の眼路（めぢ）をかぎり
            れいろうの天の海には
              聖玻璃（せいはり）の風が行き交ひ
                ZYPRESSEN 春のいちれつ
                  くろぐろと光素（エーテル）を吸ひ
                    その暗い脚並からは
                      天山の雪の稜さへひかるのに
                      （かげろふの波と白い偏光）
                      まことのことばはうしなはれ
                    雲はちぎれてそらをとぶ
                  ああかがやきの四月の底を
                はぎしり燃えてゆききする
              おれはひとりの修羅なのだ
      - id: kussetsuritsu
        kind: poem
        location: 屈折率
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          七つ森のこつちのひとつが
          水の中よりもつと明るく
          そしてたいへん巨きいのに
          わたくしはでこぼこ凍つたみちをふみ
          このでこぼこの雪をふみ
          向ふの縮れた亜鉛（あえん）の雲へ
          陰気な郵便脚夫（きやくふ）のやうに
              （またアラツデイン　洋燈（ラムプ）とり）
          急がなければならないのか
      - id: nichirin-to-taichi
        kind: poem
        location: 日輪と太市
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          日は今日は小さな天の銀盤で
          雲がその面（めん）を
          どんどん侵してかけてゐる
          吹雪（フキ）も光りだしたので
          太市は毛布（けつと）の赤いズボンをはいた
      - id: carbide-soko
        kind: poem
        location: カーバイト倉庫・冒頭
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          まちなみのなつかしい灯とおもつて
          いそいでわたくしは雪と蛇紋岩（サーベンタイン）との
          山峡（さんけふ）をでてきましたのに
          これはカーバイト倉庫の軒
          すきとほつてつめたい電燈です
      - id: cobalt-sanchi
        kind: poem
        location: コバルト山地
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          コバルト山地（さんち）の氷霧（ひようむ）のなかで
          あやしい朝の火が燃えてゐます
          毛無森（けなしのもり）のきり跡あたりの見当（けんたう）です
          たしかにせいしんてきの白い火が
          水より強くどしどしどしどし燃えてゐます
      - id: tani
        kind: poem
        location: 谷
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          ひかりの澱
          三角ばたけのうしろ
          かれ草層の上で
          わたくしの見ましたのは
          顔いつぱいに赤い点うち
          硝子様（やう）鋼青のことばをつかつて
          しきりに歪み合ひながら
          何か相談をやつてゐた
          三人の妖女たちです
      - id: fukei
        kind: poem
        location: 風景
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          雲はたよりないカルボン酸
          さくらは咲いて日にひかり
          また風が来てくさを吹けば
          截られたたらの木もふるふ
            さつきはすなつちに廐肥（きうひ）をまぶし
                （いま青ガラスの模型の底になつてゐる）
          ひばりのダムダム弾（だん）がいきなりそらに飛びだせば
              風は青い喪神をふき
              黄金の草　ゆするゆする
                  雲はたよりないカルボン酸
                  さくらが日に光るのはゐなか風（ふう）だ
      - id: okinagusa-poem
        kind: poem
        location: おきなぐさ
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          風はそらを吹き
          そのなごりは草をふく
          おきなぐさ冠毛（くわんもう）の質直（しつぢき）
          松とくるみは宙に立ち
              （どこのくるみの木にも
                いまみな金（きん）のあかごがぶらさがる）
          ああ黒のしやつぽのかなしさ
          おきなぐさのはなをのせれば
          幾きれうかぶ光酸（くわうさん）の雲
      - id: kawabata
        kind: poem
        location: かはばた
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html
        text: |2-
          かはばたで鳥もゐないし
          （われわれのしよふ燕麦（オート）の種子（たね）は）
          風の中からせきばらひ
          おきなぐさは伴奏をつゞけ
          光のなかの二人の子
    places:
      - ref: ihatov
        location: イーハトヴの氷霧
        source_url: https://www.aozora.gr.jp/cards/000081/files/1058_15403.html

  - id: gusukobudori-no-denki
    title: グスコーブドリの伝記
    announced_year: 1932
    edition:
      aozora_id: 1924
      url: https://www.aozora.gr.jp/cards/000081/card1924.html
      bibliography: |-
        「童話集　風の又三郎」岩波文庫、岩波書店
        1951年4月25日第1刷発行
        1997年8月4日第70刷発行
    quotes:
      - id: gusukobudori-forest
        kind: passage
        location: 一 森・冒頭
        source_url: https://www.aozora.gr.jp/cards/000081/files/1924_14254.html
        text: |-
          　グスコーブドリは、イーハトーヴの大きな森のなかに生まれました。おとうさんは、グスコーナドリという名高い木こりで、どんな大きな木でも、まるで赤ん坊を寝かしつけるようにわけなく切ってしまう人でした。
          　ブドリにはネリという妹があって、二人は毎日森で遊びました。ごしっごしっとおとうさんの木を挽（ひ）く音が、やっと聞こえるくらいな遠くへも行きました。二人はそこで木いちごの実をとってわき水につけたり、空を向いてかわるがわる山鳩（やまばと）の鳴くまねをしたりしました。するとあちらでもこちらでも、ぽう、ぽう、と鳥が眠そうに鳴き出すのでした。
          　おかあさんが、家の前の小さな畑に麦を播（ま）いているときは、二人はみちにむしろをしいてすわって、ブリキかんで蘭（らん）の花を煮たりしました。するとこんどは、もういろいろの鳥が、二人のぱさぱさした頭の上を、まるで挨拶（あいさつ）するように鳴きながらざあざあざあざあ通りすぎるのでした。
    places:
      - id: ihatov
        name: イーハトーヴ
        real: false
        location: 一 森
        source_url: https://www.aozora.gr.jp/cards/000081/files/1924_14254.html
      - id: carbonado-volcano
        # 本文の「カルボナード火山島」に由来する、仕様で指定された呼称。
        name: カルボナード火山
        real: false
        location: 九 カルボナード島
        source_url: https://www.aozora.gr.jp/cards/000081/files/1924_14254.html
