  - id: ginga-tetsudo-no-yoru
    title: 銀河鉄道の夜
    edition:
      aozora_id: 43737
      url: https://www.aozora.gr.jp/cards/000081/card43737.html
      bibliography: |-
        「銀河鉄道の夜」角川文庫、角川書店
        1969年7月20日改版
        入力：1987年3月30日改版50版、校正：1991年6月10日改版65版
        底本の親本：「宮澤賢治全集第十卷」筑摩書房、1967年10月25日
    quotes:
      - id: ginga-tetsudo-no-yoru-opening
        kind: passage
        location: 一 午後の授業・冒頭2段落
        source_url: https://www.aozora.gr.jp/cards/000081/files/43737_19215.html
        text: |-
          「ではみなさんは、そういうふうに川だと言（い）われたり、乳（ちち）の流（なが）れたあとだと言（い）われたりしていた、このぼんやりと白いものがほんとうは何かご承知（しょうち）ですか」先生は、黒板（こくばん）につるした大きな黒い星座（せいざ）の図の、上から下へ白くけぶった銀河帯（ぎんがたい）のようなところを指（さ）しながら、みんなに問（と）いをかけました。
          カムパネルラが手をあげました。それから四、五人手をあげました。ジョバンニも手をあげようとして、急（いそ）いでそのままやめました。たしかにあれがみんな星だと、いつか雑誌（ざっし）で読んだのでしたが、このごろはジョバンニはまるで毎日教室でもねむく、本を読むひまも読む本もないので、なんだかどんなこともよくわからないという気持（きも）ちがするのでした。
      - id: ginga-hontou-no-saiwai
        kind: passage
        location: 九 ジョバンニの切符・ほんとうのさいわい
        source_url: https://www.aozora.gr.jp/cards/000081/files/43737_19215.html#midashi90
        content_warnings:
          - 他者の幸福のために自分の身体を焼いてもよいとする、自己犠牲への言及があります。
        text: |-
          「カムパネルラ、また僕（ぼく）たち二人（ふたり）きりになったねえ、どこまでもどこまでもいっしょに行こう。僕（ぼく）はもう、あのさそりのように、ほんとうにみんなの幸（さいわい）のためならば僕（ぼく）のからだなんか百ぺん灼（や）いてもかまわない」
          「うん。僕（ぼく）だってそうだ」カムパネルラの眼（め）にはきれいな涙（なみだ）がうかんでいました。
          「けれどもほんとうのさいわいはいったいなんだろう」
          ジョバンニが言（い）いました。
          「僕（ぼく）わからない」カムパネルラがぼんやり言（い）いました。
          「僕（ぼく）たちしっかりやろうねえ」ジョバンニが胸（むね）いっぱい新しい力が湧（わ）くように、ふうと息（いき）をしながら言（い）いました。
    beings:
      - id: giovanni
        kind: person
        name: ジョバンニ
        source_url: https://www.aozora.gr.jp/cards/000081/files/43737_19215.html
      - id: campanella
        kind: person
        name: カムパネルラ
        source_url: https://www.aozora.gr.jp/cards/000081/files/43737_19215.html

