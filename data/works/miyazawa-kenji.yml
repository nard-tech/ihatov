  - id: polano-no-hiroba
    title: ポラーノの広場
    edition:
      aozora_id: 1935
      url: https://www.aozora.gr.jp/cards/000081/card1935.html
      bibliography: |-
        「銀河鉄道の夜・風の又三郎・ポラーノの広場　ほか３編」講談社文庫、講談社
        1971年7月1日初版発行、1979年8月15日第16刷
    quotes:
      - id: polano-ihatovo
        kind: passage
        location: 序・「あのイーハトーヴォの」から2段落
        source_url: https://www.aozora.gr.jp/cards/000081/files/1935_19925.html
        text: |-
          あのイーハトーヴォのすきとおった風、夏でも底に冷たさをもつ青いそら、うつくしい森で飾られたモリーオ市、郊外のぎらぎらひかる草の波。
          またそのなかでいっしょになったたくさんのひとたち、ファゼーロとロザーロ、羊飼のミーロや、顔の赤いこどもたち、地主のテーモ、山猫博士のボーガント・デストゥパーゴなど、いまこの暗い巨きな石の建物のなかで考えていると、みんなむかし風のなつかしい青い幻燈のように思われます。では、わたくしはいつかの小さなみだしをつけながら、しずかにあの年のイーハトーヴォの五月から十月までを書きつけましょう。

