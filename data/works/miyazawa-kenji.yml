        kind: tanka
        location: 宮沢賢治の項・浄土ヶ浜の歌
        source_url: https://www.city.miyako.iwate.jp/gyosei/soshiki/kanko/7/1156.html
        text: |-
          うるはしの
          海のビロード 昆布らは
          寂光のはまに 敷かれひかりぬ
