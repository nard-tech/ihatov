        source_url: https://www.aozora.gr.jp/cards/000081/files/43734_17913.html
        text: |-
          イーハトヴは一つの地名である。しいて、その地点を求むるならば、それは、大小クラウスたちの耕していた、野原や、少女アリスがたどった鏡の国と同じ世界の中、テパーンタール砂漠のはるかな北東、イヴン王国の遠い東と考えられる。
          じつにこれは著者の心象中に、このような状景（じょうけい）をもって実在したドリームランドとしての日本岩手県である。

