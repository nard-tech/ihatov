works:
  - id: ichiaku-no-suna
    title: 一握の砂
    published_year: 1910
    edition:
      aozora_id: 816
      url: https://www.aozora.gr.jp/cards/000153/card816.html
      bibliography: |-
        「日本文学全集12　国木田独歩　石川啄木集」集英社
        1967年9月12日初版発行、1972年9月10日9版発行
        底本の親本：「一握の砂」東雲堂書店、1910年12月1日刊行
    quotes:
      - id: tokai-no-kojima
        kind: tanka
        location: 我を愛する歌・冒頭
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        text: |-
          東海（とうかい）の小島（こじま）の磯（いそ）の白砂（しらすな）に
          われ泣（な）きぬれて
          蟹（かに）とたはむる
      - id: inochinaki-suna
        kind: tanka
        location: 我を愛する歌
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        text: |-
          いのちなき砂のかなしさよ
          さらさらと
          握（にぎ）れば指のあひだより落つ
      - id: dai-toiu-ji
        kind: tanka
        location: 我を愛する歌
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        content_warnings:
          - 自死を考える場面への言及があります。
        text: |-
          大（だい）という字を百あまり
          砂に書き
          死ぬことをやめて帰り来（きた）れり
      - id: tawamure-ni-haha
        kind: tanka
        location: 我を愛する歌
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        text: |-
          たはむれに母を背負（せお）ひて
          そのあまり軽（かろ）きに泣きて
          三歩あゆまず
      - id: shittorito-namida
        kind: tanka
        location: 我を愛する歌
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        text: |-
          しっとりと
          なみだを吸（す）へる砂の玉
          なみだは重きものにしあるかな
      - id: namida-namida
        kind: tanka
        location: 我を愛する歌
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        text: |-
          なみだなみだ
          不思議なるかな
          それをもて洗（あら）へば心戯（おど）けたくなれり
      - id: mare-ni-aru
        kind: tanka
        location: 我を愛する歌
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        text: |-
          まれにある
          この平（たひら）なる心には
          時計の鳴るもおもしろく聴（き）く
      - id: nantonaku-kisha
        kind: tanka
        location: 我を愛する歌
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        text: |-
          何（なに）となく汽車に乗りたく思ひしのみ
          汽車を下（お）りしに
          ゆくところなし
      - id: yawarakani-yuki
        kind: tanka
        location: 我を愛する歌
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        text: |-
          やはらかに積れる雪に
          熱（ほ）てる頬（ほ）を埋（うづ）むるごとき
          恋してみたし
      - id: kokoroyoku-hito
        kind: tanka
        location: 我を愛する歌
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        text: |-
          こころよく
          人を讃（ほ）めてみたくなりにけり
          利己（りこ）の心に倦（う）めるさびしさ
      - id: kokoroyoki-tsukare
        kind: tanka
        location: 我を愛する歌
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        text: |-
          こころよき疲れなるかな
          息もつかず
          仕事をしたる後（のち）のこの疲れ
      - id: hatarakedo
        kind: tanka
        location: 我を愛する歌
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        text: |-
          はたらけど
          はたらけど猶（なほ）わが生活（くらし）楽にならざり
          ぢっと手を見る
      - id: suisho-no-tama
        kind: tanka
        location: 我を愛する歌
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        text: |-
          水晶（すゐしやう）の玉をよろこびもてあそぶ
          わがこの心
          何（なに）の心ぞ
      - id: oinaru-suisho
        kind: tanka
        location: 我を愛する歌
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        text: |-
          大いなる水晶の玉を
          ひとつ欲（ほ）し
          それにむかひて物を思はむ
      - id: tomo-ga-mina
        kind: tanka
        location: 我を愛する歌
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        text: |-
          友がみなわれよりえらく見ゆる日よ
          花を買ひ来（き）て
          妻（つま）としたしむ
      - id: kozukata-no-oshiro
        kind: tanka
        location: 煙・一
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        text: |-
          不来方（こずかた）のお城の草に寝ころびて
          空に吸はれし
          十五（じふご）の心
      - id: furusato-no-namari
        kind: tanka
        location: 煙・二
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        text: |-
          ふるさとの訛（なまり）なつかし
          停車場（ていしやば）の人ごみの中に
          そを聴（き）きにゆく
      - id: furusato-no-yama
        kind: tanka
        location: 煙・二
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
        text: |-
          ふるさとの山に向ひて
          言ふことなし
          ふるさとの山はありがたきかな
    places:
      - id: kozukata-jo
        name: 不来方城
        real: true
        location: 煙・一「不来方のお城の草に寝ころびて」
        source_url: https://www.aozora.gr.jp/cards/000153/files/816_15786.html
