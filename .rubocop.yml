AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'

# The data loader validates a complete schema; keep its branches explicit.
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
Metrics/ClassLength:
  Max: 250
Metrics/MethodLength:
  Max: 30
  CountAsOne: ['array', 'hash', 'heredoc']
Metrics/AbcSize:
  Max: 40

# Named keyword arguments keep YARD's public parameter documentation usable.
Style/ArgumentsForwarding:
  UseAnonymousForwarding: false

# Immutable values deliberately enumerate their keyword-only metadata fields.
Metrics/ParameterLists:
  CountKeywordArgs: false
